<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Żeglarz jachtowy — nauka do egzaminu</title>
<style>
  :root{
    --bg:#0f1c2e; --card:#ffffff; --ink:#1a2433; --muted:#5b6b7f;
    --line:#e2e8f0; --accent:#0a6b57; --accent-soft:#e7f4f0;
    --hook:#b45309; --hook-soft:#fdf3e3; --band:#12406b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#f4f6f9;color:var(--ink);line-height:1.5;}
  header{background:linear-gradient(135deg,#0f1c2e,#12406b);color:#fff;padding:22px 18px;}
  header h1{margin:0 0 4px;font-size:20px;letter-spacing:.2px}
  header p{margin:0;color:#b7c6d9;font-size:13px}
  .wrap{max-width:900px;margin:0 auto;padding:16px 14px 60px}
  .cats{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 6px}
  .cat{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;
    padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
  .cat.active{background:var(--band);color:#fff;border-color:var(--band)}
  .cat.soon{opacity:.45;cursor:not-allowed}
  .controls{position:sticky;top:0;z-index:5;background:#f4f6f9;padding:10px 0;display:flex;
    gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
  #q{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:13px;cursor:pointer}
  .btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .count{font-size:12px;color:var(--muted);margin-left:auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin:12px 0;
    box-shadow:0 1px 2px rgba(16,32,54,.04)}
  .card.done{opacity:.55}
  .qhead{display:flex;gap:10px;align-items:flex-start}
  .num{flex:0 0 auto;min-width:30px;height:30px;border-radius:8px;background:var(--band);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .qtext{font-weight:600;font-size:15.5px}
  .img{display:inline-block;font-size:11px;color:#8a5a00;background:#fff6e6;border:1px solid #f0d9a8;
    border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
  .ans{margin:10px 0 0;padding:9px 11px;background:var(--accent-soft);border-left:3px solid var(--accent);
    border-radius:8px;font-size:14.5px}
  .ans b{color:var(--accent)}
  .hook{margin:8px 0 0;padding:9px 11px;background:var(--hook-soft);border-left:3px solid var(--hook);
    border-radius:8px;font-size:13.5px;color:#5c3d0a}
  .figure{margin:10px 0 0;text-align:center}
  .opts{margin:10px 0 0;display:flex;flex-direction:column;gap:7px}
  .opt{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:14.5px;cursor:pointer;transition:.12s}
  .opt:hover{border-color:#9db8d6}
  .opt.correct{background:var(--accent-soft);border-color:var(--accent);color:#0a4a3c;font-weight:600}
  .opt.wrong{background:#fdecec;border-color:#d9534f;color:#8a2b28}
  .opt.locked{cursor:default}
  .opt .tick{float:right}
  .revealnote{margin:9px 0 0;padding:9px 11px;background:var(--hook-soft);border-left:3px solid var(--hook);border-radius:8px;font-size:13.5px;color:#5c3d0a;display:none}
  .revealnote.show{display:block}
  .noopts{margin:10px 0 0;padding:10px 12px;background:#fff6e6;border:1px solid #f0d9a8;border-radius:9px;font-size:13px;color:#8a5a00}
  .figure img{max-width:100%;max-height:260px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px}
  .figcap{display:block;font-size:11px;color:var(--muted);margin-top:3px}
  .sources{background:#eef4fb;border:1px solid #d3e2f2;border-radius:12px;padding:11px 13px;margin:6px 0 4px}
  .sources b{display:block;font-size:13px;margin-bottom:5px;color:var(--band)}
  .sources a{display:block;font-size:12.5px;color:#12406b;margin:3px 0;text-decoration:none;border-bottom:1px dotted #9db8d6;width:fit-content}
  .sources a:hover{color:#0a2d4f}
  .hidden .ans,.hidden .hook{filter:blur(6px);cursor:pointer;user-select:none}
  .hidden .ans.reveal,.hidden .hook.reveal{filter:none;cursor:auto}
  .mark{margin-top:10px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
  .mark input{width:16px;height:16px}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:20px}
  @media print{
    .controls,.cats,header p,.mark,.btn{display:none}
    .card{break-inside:avoid;box-shadow:none}
    .hidden .ans,.hidden .hook{filter:none}
  }
</style>
</head>
<body>
<header>
  <h1>⛵ Żeglarz jachtowy — nauka do egzaminu</h1>
  <p>Pytanie → poprawna odpowiedź → dlaczego i jak zapamiętać. Materiał z trybu nauki (PZŻ).</p>
</header>
<div class="wrap">
  <div class="cats" id="cats"></div>
  <div class="controls">
    <input id="q" placeholder="Szukaj w pytaniach i odpowiedziach…">
    <button class="btn on" id="modeNauka">📖 Nauka</button>
    <button class="btn" id="modeTest">📝 Test</button>
    <button class="btn" id="hideDone">🎯 Tylko nieopanowane</button>
    <button class="btn" id="drawBtn" style="display:none">🎲 Wylosuj 20</button>
    <span class="count" id="count"></span>
  </div>
  <div id="list"></div>
</div>
<footer>Nauka do egzaminu na żeglarza jachtowego • kolejne kategorie dodawane sukcesywnie</footer>

const DATA = {
"Przepisy":[
[1,`Czarna kula wywieszona na jachcie w porze dziennej oznacza:`,`Statek na kotwicy`,`Jedna czarna kula = zawsze statek na kotwicy. Nocą odpowiada jej białe światło widoczne dookoła.`,1],

[35,`Statek znajduje się „w drodze” dopóki:`,`Nie stoi na mieliźnie`,`W drodze = nie na kotwicy, nie na mieliźnie, nie przycumowany.`,0],
[36,`Etykieta o noszeniu odbijaczy za burtą podczas żeglugi:`,`Neguje to — odbijacze wykłada się tuż przed cumowaniem`,`Fendery tylko przy cumowaniu, nie w drodze.`,0],

[75,`Po uruchomieniu silnika przyczepnego najistotniejsze jest:`,`Sprawdzenie wypływu wody chłodzącej`,`Zawsze sprawdź wodę chłodzącą.`,0],
[76,`Achterpik znajduje się:`,`W rufowej części jachtu`,`Achter = tył (rufa).`,0],
[77,`Refsejzingi to linki służące do:`,`Mocowania żagla do bomu przy refowaniu`,`Jak 33 — sznurki do zwijania.`,0],
[78,`Do olinowania ruchomego zaliczamy:`,`Fały`,`Ruchome = fały i szoty (biegają).`,0],
[79,`Jakie paliwo w czterosuwowych silnikach przyczepnych?`,`Czysta benzyna`,`Czterosuw = sama benzyna.`,0],

[81,`Rodzaj miecza z rysunku:`,`Szybrowy`,`Szybrowy = wsuwany pionowo (jak szyber).`,1],

[88,`Końce masztu to:`,`Pięta i top`,`Pięta (dół) i top (góra).`,0],

"Teoria żeglowania":[
[1,`Struga powietrza opływająca żagiel od strony zawietrznej tworzy obszar:`,`Podciśnienia`,`Zawietrzna strona żagla „ssie" (podciśnienie), jak górna strona skrzydła.`,0],
[2,`Siła, której zawdzięczamy ruch jachtu do przodu, to:`,`Siła ciągu`,`Ciąg = do przodu.`,0],
[3,`Slup zrównoważony na bajdewindzie; zerwał się szot grota. Jacht:`,`Zwiększy zawietrzność`,`Brak grota (z tyłu) → środek ożaglowania do przodu → jacht odpada (zawietrzny).`,0],
[4,`Przy słabych wiatrach wybrzuszenie żagla powinno być:`,`Większe`,`Słabo wieje = pełniejszy, „workowaty" żagiel.`,0],
[5,`Początkowe przechylanie jachtu balastowego powoduje:`,`Wzrost momentu prostującego`,`Balast im bardziej przechyla, tym mocniej prostuje.`,0],
[6,`Zbyt mocne wybranie żagli względem kursu spowoduje:`,`Spadek prędkości i wartości siły aerodynamicznej`,`Przebrane żagle = dławisz jacht.`,0],
[7,`Największy wpływ na stateczność poprzeczną lekkiego jachtu ma:`,`Kształt kadłuba (potem konstrukcja i balastowanie)`,`Mieczówka trzyma się głównie kształtem kadłuba.`,0],
[8,`Największy moment prostujący jachtu mieczowego jest przy przechyle:`,`30–45°`,`Mieczówka „najmocniej prostuje" przy 30–45°.`,0],
[9,`Przy silnych wiatrach żagle powinny być:`,`Bardziej płaskie`,`Mocno wieje = płaski żagiel.`,0],
[10,`Aby gwałtownie odpaść na slupie (poza sterem) należy:`,`Luzować szoty grota, zostawiając wybrany fok`,`Puść grot, trzymaj fok — fok spycha dziób od wiatru.`,0],
[11,`Kąt krytyczny to:`,`Kąt, po przekroczeniu którego jacht się wywróci`,`Kąt krytyczny = punkt bez powrotu.`,0],
[12,`Siła aerodynamiczna to:`,`Siła powstająca na żaglach pod działaniem wiatru`,`Wiatr na żaglu = siła aerodynamiczna.`,0],
[13,`Kurs, na którym wiatr rzeczywisty wieje prostopadle do osi jachtu, to:`,`Półwiatr`,`Półwiatr = wiatr z boku (~90°).`,0],
[14,`Przesunięcie załogi z rufy na dziób spowoduje:`,`Wzrost nawietrzności`,`Ciężar na dziób → jacht ostrzy (nawietrzny).`,0],
[15,`Przejście z baksztagu jednego halsu na baksztag drugiego halsu to:`,`Zwrot przez rufę`,`Rufa przez linię wiatru = zwrot przez rufę.`,0],
[16,`Wiatr pozorny to:`,`Wypadkowa wiatru własnego i rzeczywistego`,`Pozorny = rzeczywisty + ruch jachtu.`,0],
[17,`Zwiększenie nawietrzności uzyskamy przez:`,`Zrzucenie foka`,`Mniej z przodu (fok) → jacht ostrzy.`,0],
[18,`Przejście od bajdewindu do baksztagu tego samego halsu to:`,`Odpadanie`,`Z ostrego na pełniejszy = odpadanie.`,0],
[19,`Jachty ostrzące bez udziału steru są:`,`Nawietrzne`,`Sam ostrzy = nawietrzny.`,0],
[20,`Podniesienie płetwy sterowej o 45° spowoduje:`,`Pogorszenie sterowności`,`Mniej płetwy w wodzie = gorzej steruje.`,0],
[21,`Na jakich kursach najbardziej przydatny jest obciągacz bomu?`,`W fordewindzie i baksztagu`,`Kursy pełne (z wiatrem) = obciągacz trzyma bom w dole.`,0],
[22,`Wiatr pozorny na kursie fordewind jest:`,`Słabszy od wiatru rzeczywistego`,`Uciekasz z wiatrem = pozorny słabszy.`,0],
[23,`Siła wyporu jachtu zależy od:`,`Ciężaru jachtu`,`Archimedes — ile waży, tyle wody wypiera.`,0],
[24,`Fordewind: fok po prawej, grot po lewej. Jacht płynie:`,`Prawym halsem`,`Grot po lewej = wiatr z prawej = prawy hals.`,0],
[25,`Jak zwiększyć zawietrzność jachtu?`,`Zwiększyć powierzchnię żagli przednich`,`Więcej foka (z przodu) = zawietrzność.`,0],
[26,`Jachty mieczowe wywracają się po przechyleniu o około:`,`60–80°`,`Mieczówka „kładzie się" przy 60–80°.`,0],
[27,`Najostrzej 40° do wiatru — jaki kąt martwy?`,`80°`,`Kąt martwy = 2× najostrzejszy (2×40 = 80°).`,0],
[28,`Siła aerodynamiczna na żaglu jest efektem:`,`Różnicy ciśnień między stronami żagla`,`Różnica ciśnień = siła.`,0],
[29,`Jaki wiatr działa na jacht w ruchu?`,`Wiatr pozorny`,`Płyniesz = czujesz pozorny.`,0],
[30,`Odpadanie oznacza, że:`,`Zmieniamy kurs z ostrzejszego na pełniejszy`,`Odpadasz = od wiatru (pełniej).`,0],
[31,`Płynne ostrzenie na slupie uzyskamy przez:`,`Wybranie do optymalnej pracy grota, potem foka`,`Ostrzysz — najpierw grot (ciągnie dziób do wiatru).`,0],
[32,`Refowanie żagla to:`,`Zmniejszenie powierzchni żagla i obniżenie jego środka`,`Ref = mniejszy i niższy żagiel.`,0],
[33,`Wzrost prędkości (dodatkowy silnik) sprawia, że wiatr pozorny jest:`,`Ostrzejszy i silniejszy`,`Szybciej = pozorny ostrzejszy.`,0],
[34,`Zwrot przez rufę to:`,`Przejście rufą linii wiatru z baksztagu jednego halsu na baksztag drugiego`,`Rufa przez wiatr.`,0],
[35,`O stateczności poprzecznej decyduje wzajemne położenie:`,`Środka ciężkości i środka wyporu zanurzonej części kadłuba`,`SC vs SW decyduje o stateczności.`,0],
[36,`Skręcanie jachtem w kierunku linii wiatru to:`,`Ostrzenie`,`Do wiatru = ostrzenie.`,0],
[37,`Wyporność pływaków wywracalnego jachtu (w litrach) względem masy (kg) powinna być:`,`Większa`,`Litry pływaków > kilogramy masy (żeby nie utonął).`,0],
[38,`Sektor po obu stronach linii wiatru, w którym żagle łopoczą, to:`,`Kąt martwy`,`Kąt martwy = strefa łopotu (nie popłyniesz).`,0],
[39,`Prawidłowy zwrot przez sztag to:`,`Przejście dziobem linii wiatru z bajdewindu jednego halsu na bajdewind drugiego`,`Dziób przez wiatr.`,0],
[40,`Silnik stacjonarny, jacht płynie wstecz, ster wychylony w lewo. Jacht:`,`Rufa skręci w stronę wychylenia steru`,`Na wstecznym rufa idzie tam, gdzie ster.`,0],
[41,`Znaczne zarefowanie grota przy pełnym foku (slup) spowoduje:`,`Zwiększenie zawietrzności`,`Mniej grota = środek do przodu = zawietrzność.`,0],
[42,`Wielkość siły aerodynamicznej (przy tej samej sile wiatru) zależy od:`,`Kąta natarcia, powierzchni i profilu żagla`,`Kąt + powierzchnia + kształt żagla.`,0],
[43,`Refowanie tylko foka (roler na sztagu) spowoduje:`,`Przesunięcie środka ożaglowania do tyłu`,`Mniej foka (z przodu) → środek do tyłu → nawietrzność.`,0],
[44,`Slup (grot i fok) płynie lewym halsem, jeżeli:`,`Ma wiatr z lewej burty (grot wybrany po prawej)`,`Wiatr z lewej = lewy hals (grot na prawo).`,0],
[45,`Refowanie grota do bomu na slupie spowoduje:`,`Obniżenie i przesunięcie środka ożaglowania do przodu`,`Ref grota = niżej i do przodu.`,0],
[46,`Nadmierne wybranie prawidłowo ustawionych żagli spowoduje:`,`Zmniejszenie siły ciągu i na pewnych kursach wzrost dryfu`,`Przebrane = mniej ciągu, więcej dryfu.`,0],
[47,`Moment prostujący przy przechyle ~45° jest bliski zeru. To jacht:`,`Wywracalny`,`Prostujący znika przy 45° = wywracalny.`,0],
[48,`Halsowanie pod silny wiatr na slupie turystycznym — najbezpieczniej:`,`Zarefować grot i postawić/zarefować mniejszy fok`,`Silny wiatr = zmniejsz żagle (ref grota + mały fok).`,0],
[49,`Zrzucenie foka na slupie (grot i fok postawione) spowoduje:`,`Zwiększenie nawietrzności`,`Bez foka = jacht ostrzy (nawietrzny).`,0],
[50,`Aby ułatwić odpadanie z półwiatru (fok i grot) należy:`,`Luzować szoty grota`,`Puść grot = jacht odpada.`,0],
[51,`Na jakich kursach najbardziej przydatny jest obciągacz bomu?`,`W fordewindzie i baksztagu`,`Jak 21 — kursy pełne.`,0],
[52,`Siła powodująca dryf jachtu to:`,`Składowa siły aerodynamicznej prostopadła do osi jachtu`,`Dryf = boczna składowa siły aero.`,0],
[53,`Jacht stoi zacumowany do boi. Jaki wiatr odczuwamy?`,`Rzeczywisty`,`Stoisz = czujesz wiatr rzeczywisty.`,0],
[54,`O stateczności poprzecznej decyduje położenie:`,`Środka ciężkości i środka wyporu zanurzonej części kadłuba`,`Jak 35 — SC vs SW.`,0],
[55,`Wyporność pływaków wywracalnego jachtu (litry) względem masy (kg):`,`Większa`,`Jak 37 — pływaki > masa.`,0],
[56,`Ruch naprzód, ster w lewo — jacht:`,`Skręt w lewo: dziób w lewo, rufa w prawo`,`Ster w lewo = dziób w lewo.`,0],
[57,`Prawidłowy zwrot przez rufę to:`,`Przejście rufą linii wiatru z baksztagu na baksztag przeciwnego halsu`,`Jak 34 — rufa przez wiatr.`,0],
[58,`Kurs 60° do wiatru rzeczywistego nazywamy:`,`Bajdewind`,`~45–80° = bajdewind.`,0],
[59,`Obniżenie środka ożaglowania (refowanie) na moment przechylający:`,`Zmniejsza go`,`Niższy żagiel = mniejszy przechył.`,0],
[60,`Ciśnienie powietrza po stronach żagla:`,`Spada po stronie zawietrznej`,`Zawietrzna „ssie" (podciśnienie).`,0],
[61,`Na kursie baksztag siła powodująca dryf jest:`,`Najmniejsza`,`Pełny kurs = mały dryf.`,0],
[62,`Fordewind to kurs, przy którym wiatr wieje:`,`Dokładnie od strony rufy`,`Fordewind = wiatr w plecy.`,0],
[63,`Czy podniesienie miecza na baksztagu zwiększy dryf?`,`Nie, bo siła aerodynamiczna jest skierowana zgodnie z ruchem jachtu`,`Na pełnym kursie miecz mniej potrzebny.`,0],
[64,`Jakim kursem płynie jacht z rysunku (wiatr rzeczywisty — niebieska strzałka)?`,`Baksztagiem`,`Odczyt z rysunku (wiatr zza trawersu). (rysunek)`,1],
[65,`Przesunięcie środka bocznego oporu mieczówki uzyskamy przez:`,`Balastowanie wzdłużne (dziób/rufa) i/lub ustawienie miecza`,`Obciążenie dziobu/rufy + miecz przesuwają opór boczny.`,0],
[66,`Jednoczesne zarefowanie grota (do masztu) i foka (roler) na zrównoważonym slupie:`,`Zwiększenie zawietrzności`,`Grot rolowany traci więcej pola z tyłu → zawietrzność.`,0],
[67,`Kadłub w przechyle, SC i SW jak na rysunku. Po zwiększeniu przechyłu jacht:`,`Przewróci się`,`Układ SC/SW daje moment wywracający. (rysunek)`,1],
[68,`Bajdewind, wiatr rzeczywisty >0. Największą prędkość ma zawsze:`,`Wiatr pozorny`,`Na kursach na wiatr pozorny > rzeczywisty.`,0],
[69,`Żegluga z wiatrem przy bardzo silnym wietrze (slup) — najbezpieczniej:`,`Zrzucić grot i postawić mniejszy fok`,`Sztorm z wiatrem = na samym (małym) foku.`,0],
[70,`Slup zrównoważony; zerwał się szot grota. Jacht:`,`Odpadnie`,`Brak grota = dziób ucieka od wiatru (odpada).`,0],
[71,`Najostrzej 40° do wiatru — kąt martwy wynosi:`,`80°`,`2×40 = 80° (jak 27).`,0],
[72,`Dużo osób równomiernie (bez balastowania) na mieczówce — stateczność:`,`Pogorszy się, bo środek ciężkości przesunie się do góry`,`Ludzie wysoko = SC w górę = mniej stateczny.`,0],
[73,`Moment prostujący dodatni w zakresie 0°–90°. To jacht:`,`Niewywracalny`,`Prostuje aż do 90° = niewywracalny.`,0],
[74,`Wskaźnik wiatru jachtu stojącego nieruchomo wskazuje wiatr:`,`Rzeczywisty`,`Stoisz = rzeczywisty (Windex).`,0],
[75,`Zmiana kursu z bajdewindu na baksztag (z ustawieniem żagli):`,`Siła przechylająca maleje`,`Odpadasz = mniejszy przechył.`,0],
[76,`Przegłębienie dziobu jachtu powoduje:`,`Zwiększenie nawietrzności`,`Dziób w dół = jacht ostrzy (nawietrzny).`,0],
[77,`Na kursie bajdewind siła powodująca dryf:`,`Osiąga wartość maksymalną`,`Kurs na wiatr = największy dryf.`,0],
[78,`Podniesienie ciężkiego miecza (np. „Tango") — stateczność poprzeczna:`,`Pogorszy się`,`Ciężki miecz w górę = SC wyżej = mniej stateczny.`,0],
[79,`Wskaźnik wiatru jachtu płynącego na silniku podczas ciszy wskazuje wiatr:`,`Własny (ruchu własnego)`,`Cisza + ruch = wiatr od dziobu (własny).`,0],
[80,`Aby zwiększyć zawietrzność slupa należy:`,`Wybrać szot foka i wyluzować szot grota`,`Więcej foka, mniej grota = zawietrzność.`,0],
[81,`Półwiatr to kurs przy wietrze rzeczywistym pod kątem:`,`Nieco ponad 90°`,`Półwiatr ≈ 90° (troszkę więcej).`,0],
[82,`Wpływ prędkości na dryf na kursach na wiatr:`,`Przy większej prędkości dryf jest mniejszy (większa siła na mieczu/falszkilu)`,`Szybciej = miecz „trzyma", mniej dryfu.`,0],
[83,`Wyostrzenie z baksztagu do bajdewindu — wiatr pozorny:`,`Jego prędkość wzrośnie`,`Ostrzysz = pozorny mocniejszy.`,0],
[84,`Znaczne wychylenie steru w prawo (65°–75°) — jacht:`,`Skręca w prawo i hamuje`,`Duży wychył steru = skręt + hamowanie.`,0],
[85,`Zluzowanie szota foka przed zwrotem przez sztag spowoduje:`,`Zwiększenie nawietrzności`,`Luźny fok = jacht łatwiej ostrzy (wchodzi w zwrot).`,0],
[86,`Przy odbiorze jachtu z czarteru najważniejsze dla bezpieczeństwa jest info o:`,`Stateczności i zatapialności jachtu`,`Pytaj o stateczność i (nie)zatapialność.`,0],
[87,`Dla jakiego kursu wiatr rzeczywisty i pozorny mają ten sam kierunek?`,`Fordewindu`,`Fordewind = ten sam kierunek (pozorny tylko słabszy).`,0],
[88,`Czy wiatr pozorny jest zawsze ostrzejszy od rzeczywistego?`,`Tak, z wyjątkiem fordewindu (ten sam kierunek)`,`Ostrzejszy wszędzie oprócz fordewindu.`,0],
[89,`Półwiatr, żagle OK; włączenie silnika naprzód (szybciej). Żagle:`,`Trzeba je bardziej wybrać`,`Szybciej = pozorny ostrzejszy = wybierz żagle.`,0],
[90,`Siła hydrodynamiczna na płetwie steru zależy od:`,`Kąta wychylenia płetwy, jej powierzchni i prędkości jachtu`,`Kąt + powierzchnia + prędkość.`,0],
[91,`Miecz (lekki) na jachcie mieczowym służy do:`,`Zwiększenia oporu bocznego`,`Miecz = mniej dryfu (opór boczny).`,0],
[92,`W jakim celu stosuje się zbiorniki/elementy wypornościowe?`,`Dla zapewnienia pływalności po zalaniu/wywrotce`,`Pływaki = jacht nie tonie.`,0],
[93,`Chwilowy spadek prędkości wiatru rzeczywistego sprawia, że pozorny jest:`,`Ostrzejszy`,`Mniej wiatru = pozorny przesuwa się do przodu (ostrzejszy).`,0],
[94,`Ostry bajdewind; szkwał zwiększył wiatr rzeczywisty. Jacht może:`,`Popłynąć ostrzej do wiatru`,`Więcej wiatru = pozorny odpada = możesz ostrzyć.`,0],
[95,`Siła ciągu działająca na żagiel to:`,`Składowa siły aerodynamicznej skierowana do przodu, równolegle do osi jachtu`,`Ciąg = przód (jak 2).`,0],
[96,`Bajdewind, wiatr >0. Największą prędkość ma zawsze:`,`Wiatr pozorny`,`Jak 68 — pozorny > rzeczywisty.`,0],
[97,`Pod jakim warunkiem jacht „wywracalny" może być dopuszczony do żeglugi?`,`Jeżeli jest niezatapialny (pływaki w dm³ > masa w kg)`,`Wywracalny OK, o ile niezatapialny.`,0],
[98,`Od czego zależy droga hamowania jachtu ustawionego w linii wiatru?`,`Od masy jachtu i jego prędkości w momencie ustawienia w linii wiatru`,`Cięższy i szybszy = dłuższa droga hamowania.`,0],
[99,`Największa siła aerodynamiczna na kursach ostrych powstaje przy kącie natarcia ok.:`,`15°–25°`,`Optymalny kąt natarcia do wiatru pozornego = 15–25°.`,0]
],
"Eksploatacja i teoria manewrowania":[
[1,`Śruba prawoskrętna w osi jachtu, silnik naprzód, ster zero. Reakcja jachtu:`,`Ruszy naprzód z lekkim odrzuceniem rufy w prawo`,`Prawoskrętna naprzód = rufa w prawo (dziób w lewo).`,0],
[2,`Odejście od boi pod żaglami, silny wiatr, mało miejsca za rufą. Najbezpieczniej:`,`Założyć szpring z rufy na biegowo, postawić żagle, oddać cumę dziobową, po odpadnięciu i wybraniu żagli oddać szpring`,`Mało miejsca za rufą = odejdź na szpringu rufowym.`,0],
[3,`Przesunięcie ciężkiego jachtu wzdłuż nabrzeża w stronę dziobu. Użyć:`,`Cumy dziobowej i szpringu rufowego`,`Ciągniesz do przodu = cuma dziobowa + szpring rufowy.`,0],
[4,`Kotwiczenie na 2 m głębokości, promień łukowania ~20 m. Minimalna długość liny:`,`Około 15 m`,`Zwykle 5–7× głębokość, ale tu ogranicza promień łukowania — kompromis ~15 m.`,0],
[5,`Chcemy nietonące cumy. Jaki rodzaj wybrać?`,`Polipropylenowe`,`Polipropylen pływa.`,0],
[6,`Slup, baksztag, wszystkie żagle; przechodzimy na silnik. Zrzucanie żagli:`,`Fok wg oceny sternika, grot po ustawieniu jachtu w kącie martwym`,`Grot zrzucasz ustawiony w linii wiatru (kąt martwy).`,0],
[7,`Najważniejsze czynności przed kotwiczeniem:`,`Sprawdzić głębokość, przygotować odpowiednią długość liny i kotwicę, przygotować żagle do zrzucenia`,`Głębokość + kotwica + żagle.`,0],
[8,`Holując jacht z brzegu (kanał), linę holowniczą mocujemy:`,`W okolicy masztu jachtu`,`Hol przy maszcie — inaczej jacht się znosi.`,0],
[9,`Podejście do boi pod żaglami najskuteczniej:`,`Zrzucić fok przed podejściem, dochodzić w linii wiatru, założyć cumę na biegowo, potem zrzucić grot`,`Do boi pod wiatr, na samym grocie.`,0],
[10,`Podejście do pomostu prawą burtą pod prąd; jacht stoi. Ster w lewo:`,`Dziób odchyla się od pomostu, rufa w stronę pomostu`,`Prąd napiera na płetwę — ster działa jak przy ruchu naprzód.`,0],
[11,`Zapach tlącej się izolacji (instalacja 12 V). Należy:`,`Natychmiast zdjąć klemy z akumulatorów, a jeśli niedostępne — wyłączyć główny wyłącznik`,`Pożar elektryczny = odetnij prąd.`,0],
[12,`Po komendzie „przygotować grot do zrzucenia" załogant:`,`Rozbuchtuje fał i układa go tak, by się nie splątał; jest gotów do luzowania fału`,`Przygotuj fał: rozplącz i bądź gotów luzować.`,0],
[13,`Czarter na Mazurach — najważniejsze dla bezpieczeństwa informacje o jachcie:`,`Czy jest niezatapialny i jaką ma stateczność`,`Pytaj o (nie)zatapialność i stateczność.`,0],
[14,`Kwasowe akumulatory obsługowe — czy wymagają konserwacji?`,`Tak — dopełniania ubytków wodą destylowaną`,`Obsługowy = dolewasz wody destylowanej.`,0],
[15,`Komenda „prawy foka szot luz" oznacza:`,`Natychmiastowe i całkowite zluzowanie szota`,`„Luz" = puść całkiem.`,0],
[16,`Do człowieka za burtą lekkim jachtem mieczowym podchodzimy:`,`Kursem ostry bajdewind i burtą nawietrzną`,`Do człowieka burtą nawietrzną (masz kontrolę nad prędkością).`,0],
[17,`Woda wypływająca z boku pracującego silnika świadczy o:`,`Prawidłowym działaniu chłodzenia`,`Leci woda = OK.`,0],
[18,`Śruba prawoskrętna w osi, silnik wstecz, ster zero. Reakcja:`,`Ruszy wstecz z odrzuceniem rufy w lewo`,`Prawoskrętna wstecz = rufa w lewo.`,0],
[19,`Prawidłowe zakończenie pracy silnika przyczepnego:`,`Zmniejszyć obroty, włączyć „Luz", zgasić wyłącznikiem zapłonu, podnieść na pantografie`,`Obroty↓ → luz → gaś → podnieś.`,0],
[20,`Ulatnianie się propan-butanu wewnątrz jachtu grozi:`,`Wybuchem — gaz z powietrzem tworzy mieszaninę wybuchową`,`Gaz cięższy od powietrza zbiera się nisko = wybuch.`,0],
[21,`Ładowanie akumulatora prostownikiem — zaciski:`,`Plus do plusa, minus do minusa`,`+ do +, − do −.`,0],
[22,`Gwałtowne hamowanie „cała wstecz" (silnik stacjonarny), ster zero. Jacht:`,`Będzie skręcał w zależności od kierunku obrotów śruby`,`Na wstecznym rządzi śruba, nie ster.`,0],
[23,`Przy odejściu od boi na lewy hals ustawiamy:`,`Fok lewo na wiatr, ster lewo`,`Lewy hals = fok lewo, ster lewo.`,0],
[24,`Tankowanie zbiornika silnika przyczepnego:`,`Zostawić wolną przestrzeń, zamknąć korek wlewu i zaworek odpowietrzający`,`Nie do pełna + zakręć odpowietrznik.`,0],
[25,`Podejście do pomostu na rzece (wiatr niezbyt silny):`,`Pod prąd`,`Pod prąd — prąd hamuje, masz sterowność.`,0],
[26,`Cumowanie dziobem do pomostu, rufą do boi (na silniku):`,`Przygotować cumy, wchodzić powoli, przy mijaniu boi założyć rufową, zatrzymać przed nabrzeżem, założyć dziobową`,`Najpierw rufowa na boję, potem dziobowa na keję.`,0],
[27,`Rozrefowanie grota (zamocowany hals, refszkentla, refsejzingi):`,`Rozwiązać refsejzingi, zwolnić refszkentlę, zwolnić róg halsowy, wybierać fał`,`Kolejność: sejzingi → szkentla → hals → fał.`,0],
[28,`Komenda „założyć cumę na biegowo" oznacza:`,`Jeden koniec na pokładzie, drugi przez urządzenie cumownicze na lądzie i z powrotem na pokład`,`Biegowo = obie końcówki u Ciebie (oddasz bez schodzenia).`,0],
[29,`Cuma dziobowa przy odejściu od boi:`,`Zawiązana na biegowo, odejść na żądany hals`,`Biegowo = oddasz z pokładu.`,0],
[30,`Rufą do nabrzeża, brak cumy dziobowej, silny wiatr od dziobu:`,`Silnik naprzód wg potrzeby, luzować cumy rufowe i założyć dziobową, silnik stop, ustawić na cumach`,`Dotrzymuj silnikiem, aż złapiesz dziób.`,0],
[31,`Mieszanka paliwa i oleju do dwusuwu — czym się kierować?`,`Instrukcją obsługi danego silnika`,`Proporcja zawsze z instrukcji.`,0],
[32,`Aby zmniejszyć dryf, zwłaszcza na ostrych kursach:`,`Opuścić miecz`,`Miecz w dół = mniej dryfu.`,0],
[33,`5 osób, a na jachcie 4 pasy i 1 koło. Wystarczające?`,`Nie`,`1 kamizelka na osobę — brakuje jednej.`,0],
[34,`MOB na pełnym baksztagu — najprostszy manewr:`,`Podostrzyć, odejść nie za daleko, zwrot przez sztag i podejść bajdewindem`,`Wróć do człowieka bajdewindem (kontrola prędkości).`,0],
[35,`Mieczowo-balastowy 7 m, Mazury — orientacyjna długość liny kotwicznej:`,`25 m`,`Mały jacht ≈ 25 m liny.`,0],
[36,`Morski balastowy 8 m — ile i jakich cum wg dobrej praktyki?`,`4 cumy po ok. 12 m`,`4 cumy × 12 m.`,0],
[37,`Jak cumujemy w śluzie?`,`Na biegowo`,`Śluza = biegowo (poziom wody się zmienia).`,0],
[38,`Obroty silnika przyczepnego wzrosły, ale jacht zwalnia i staje. Przyczyna:`,`Rozłączenie śruby z wałkiem (ścięcie sworznia/zabezpieczenia śruby)`,`Obroty w górę, brak ciągu = ścięty klin śruby.`,0],
[39,`Odejście od pomostu pod żaglami (rysunek, wiatr — niebieska strzałka):`,`Przecumować dziobem do wiatru, postawić żagle, odejść lewym halsem`,`Ustaw dziób do wiatru i odejdź. (rysunek)`,1],
[40,`Ciasny skręt w prawo na silniku stacjonarnym, mało miejsca:`,`Ster prawo na burt, krótko „cała naprzód", silnik stop — powtarzać do skutku`,`Szarpnięcia naprzód przy sterze na burcie = obrót w miejscu.`,0],
[41,`Odejście od przystani pod żaglami (rysunek):`,`Przenieść cumę rufową na dziób na biegowo, ustawić się pod wiatr, postawić żagle, oddać cumę`,`Przełóż cumę na dziób i ustaw się pod wiatr. (rysunek)`,1],
[42,`Przy odejściu od boi na prawy hals ustawiamy:`,`Fok prawo na wiatr, ster prawo`,`Prawy hals = fok prawo, ster prawo.`,0],
[43,`Odejście wstecz na silniku od pomostu; dziób ma iść w prawo. Ster:`,`W lewo`,`Na wstecznym ster „odwrotnie": chcesz dziób w prawo → ster w lewo.`,0],
[44,`Intensywne hamowanie żaglami polega na:`,`Wynoszeniu żagli na wiatr`,`Żagle na wiatr = hamowanie.`,0],
[45,`Dwusuwowy silnik przyczepny mocno dymi. Przyczyna:`,`Zbyt dużo oleju w paliwie`,`Dymi = za dużo oleju w mieszance.`,0],
[46,`Zwrot przez sztag o najmniejszym promieniu:`,`Ster na burtę; w linii wiatru zluzować grot; nawietrzny szot foka luzować dopiero po odpadnięciu, potem wybrać zawietrzny fok`,`Fok „na backstag" pomaga przerzucić dziób.`,0],
[47,`Zerwał się fał foka na małej mieczówce (Omega). Naprawa:`,`Położyć maszt i wymienić fał`,`Naprawa fału = połóż maszt.`,0],
[48,`Odejście przy wietrze odpychającym (rysunek). Na który hals — pierwsze komendy:`,`Na prawy hals: fok prawo na wiatr, ster prawo, cumę oddaj`,`Wiatr odpycha — łatwo odejść na foku. (rysunek)`,1],
[49,`Kąt martwy 120°. Kiedy zrobić zwrot przez sztag, by jednym halsem dojść do boi?`,`Gdy płynąc ostrym bajdewindem zobaczymy obiekt pod kątem nieco większym niż 120° od kursu`,`Obiekt „za kątem martwym" = czas na zwrot.`,0],
[50,`Mieczowo-balastowy 7 m, Mazury — długość liny kotwicznej:`,`25 m`,`Jak 35 — ok. 25 m.`,0],
[51,`Postawienie żagli z silnika:`,`Na małej szybkości ustawić jacht w kącie martwym pod wiatr, postawić grot, potem fok, zgasić silnik`,`Stawiasz żagle pod wiatr, najpierw grot.`,0],
[52,`Maksymalne naładowanie akumulatora prostownikiem:`,`Ładować minimalnym prądem przez długi czas`,`Wolno i długo = pełne naładowanie.`,0],
[53,`Bojrep wykorzystujemy:`,`W czasie kotwiczenia`,`Bojrep = lina „ratunkowa" do wyrwania zaklinowanej kotwicy.`,0],
[54,`Gdy z odpływu pracującego silnika przyczepnego przestanie lecieć woda:`,`Natychmiast wyłączyć silnik`,`Brak wody = STOP (przegrzeje się).`,0],
[55,`Odejście wstecz na szpringu rufowym (prawa burta); dziób ma odejść od pomostu. Ster:`,`Na prawo`,`Ster tak, by rufa dociskała do szpringu, a dziób odchodził.`,0],
[56,`Refowanie foka na rolerze:`,`Wybieramy fał rolera, luzując szot foka`,`Zwijasz fok: ciągnij fał rolera, luzuj szot.`,0],
[57,`Silny wiatr odpychający prostopadle do burty (miejsce po lewej). Odejście pod żaglami:`,`Cuma dziobowa na biegowo, oddać resztę, po ustawieniu w linii wiatru postawić grot i fok, odejść oddając dziobową`,`Wiatr odpycha — zostaw dziobową i pozwól rufie odejść.`,0],
[58,`Holowanie jachtu z brzegu (kanał) — linę mocujemy:`,`W okolicy masztu jachtu`,`Jak 8 — hol przy maszcie.`,0],
[59,`Rufą do pomostu, dziobem przy boi, wiatr od rufy. Odejście pod żaglami:`,`Postawić fok, oddać cumy dziobową i rufową, wypłynąć na wprost, potem postawić grot`,`Wiatr od rufy wypcha Cię na foku do przodu.`,0],
[60,`Wymiana ściętego klina pędnika po wejściu na mieliznę:`,`Wyłączyć silnik, podnieść do pozycji spoczynkowej, zdjąć zawleczkę, odkręcić śrubę, wymienić klin`,`Klin ścięty = wymień (silnik wyłączony!).`,0],
[61,`Silnik na pantografie podczas żeglugi pod żaglami powinien być:`,`Podniesiony i przygotowany do awaryjnego uruchomienia`,`Pod żaglami silnik w górę, ale w gotowości.`,0],
[62,`Przesunięcie ciężkiego jachtu wzdłuż nabrzeża w stronę dziobu. Użyć:`,`Cumy dziobowej i szpringu rufowego`,`Jak 3 — dziobowa + szpring rufowy.`,0],
[63,`Śruba prawoskrętna w osi, silnik wstecz, ster zero. Reakcja:`,`Ruszy wstecz z odrzuceniem rufy w lewo`,`Prawoskrętna wstecz = rufa w lewo.`,0],
[64,`Podczas pracy silnika należy:`,`Sprawdzać, czy z otworu kontrolnego wypływa woda`,`Pilnuj wypływu wody chłodzącej.`,0],
[65,`Rozrefowanie grota (hals, refszkentla, refsejzingi):`,`Rozwiązać refsejzingi, zwolnić refszkentlę, zwolnić róg halsowy, wybierać fał`,`Jak 27 — sejzingi → szkentla → hals → fał.`,0],
[66,`Powtarzające się gaśnięcie 4-suwowego silnika zaburtowego. Przyczyna:`,`Zakręcony zawór odpowietrzenia zbiornika paliwa`,`Gaśnie = odkręć odpowietrznik (bak „się dusi").`,0],
[67,`Odejście przy wietrze dociskającym (rysunek):`,`Na silniku: cumę dziobową wybierać z prawej burty, ster lewo, wolno naprzód, cumę oddać`,`Wiatr dociska — odejdź na silniku, odpychając dziób. (rysunek)`,1],
[68,`Uruchamiając kuchenkę gazową, w pierwszej kolejności:`,`Otwieramy zawór na butli`,`Najpierw butla, potem palnik.`,0],
[69,`Gasząc płomień kuchenki gazowej:`,`Najpierw zakręcamy zawór na butli, potem zawór palnika`,`Gasisz od butli — wypalasz gaz z węża.`,0],
[70,`Kąt martwy 120°. Kiedy wykonać zwrot, by jednym halsem dojść do punktu?`,`Gdy płynąc bajdewindem zobaczymy obiekt ok. 120° po nawietrznej od kursu`,`Jak 49 — obiekt za kątem martwym.`,0]

// ==== APLIKACJA ====
let activeCat = "Przepisy";
let mode = "nauka";       // "nauka" | "test"
let hideDone = false;     // pula: tylko nieopanowane
let drawSet = null;       // wylosowany podzbiór numerów (Test) lub null
let done = {};

const catsEl = document.getElementById('cats');
CATS.forEach(c=>{
  const b=document.createElement('button');
  b.className='cat'+(c===activeCat?' active':'')+(READY[c]?'':' soon');
  b.textContent=c+(READY[c]?'':' • wkrótce');
  if(READY[c]) b.onclick=()=>switchCat(c);
  catsEl.appendChild(b);
});

async function switchCat(c){
  activeCat=c; drawSet=null;
  document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('active', x.textContent.startsWith(c)&&READY[c]&&x.textContent.indexOf('wkrótce')<0));
  done={}; try{ const r=await window.storage.get('done_'+c); if(r&&r.value) done=JSON.parse(r.value);}catch(e){}
  render();
}
async function saveDone(){ try{ await window.storage.set('done_'+activeCat, JSON.stringify(done)); }catch(e){} }

const listEl=document.getElementById('list');
const countEl=document.getElementById('count');
const qInput=document.getElementById('q');

function optsFor(n){
  const arr = (window.OPTS && window.OPTS[activeCat]) ? window.OPTS[activeCat][n-1] : null;
  return arr && arr.o ? arr : null;
}
function render(){
  const term=qInput.value.trim().toLowerCase();
  const rows=(DATA[activeCat]||[]);
  listEl.innerHTML='';
  const src=SOURCES[activeCat];
  if(src){ const sp=document.createElement('div'); sp.className='sources';
    sp.innerHTML='<b>📚 Materiały źródłowe</b>'+src.map(s=>'<a href="'+s.u+'" target="_blank" rel="noopener">'+esc(s.t)+'</a>').join(''); listEl.appendChild(sp);}
  if(mode==="test" && !(window.OPTS && window.OPTS[activeCat])){
    const w=document.createElement('div'); w.className='noopts';
    w.innerHTML='📝 Tryb Test wymaga pliku <b>zeglarz-data.js</b> obok index.html (z wariantami odpowiedzi). Wgraj go do repozytorium — do tego czasu działa tryb 📖 Nauka.';
    listEl.appendChild(w);
  }
  let shown=0, doneCount=0;
  rows.forEach(r=>{
    const [n,q,a,note,img]=r;
    if(done[n]) doneCount++;
    if(hideDone && done[n]) return;
    if(drawSet && !drawSet.has(n)) return;
    if(term && !(q.toLowerCase().includes(term)||a.toLowerCase().includes(term))) return;
    shown++;
    const imgUrl = IMG[activeCat] && IMG[activeCat][n];
    const card=document.createElement('div');
    card.className='card'+(done[n]?' done':'');
    let html='<div class="qhead"><div class="num">'+n+'</div><div class="qtext">'+esc(q)+
      (img&&!imgUrl?'<span class="img">📷 rysunek</span>':'')+'</div></div>'+
      (imgUrl?'<div class="figure"><img loading="lazy" src="'+imgUrl+'" alt="ilustracja do pytania"><span class="figcap">ilustracja źródłowa — Kliper</span></div>':'');

    if(mode==="test"){
      const opt=optsFor(n);
      if(opt){
        html+='<div class="opts">'+opt.o.map((t,i)=>'<button class="opt" data-i="'+i+'">'+esc(t)+'</button>').join('')+'</div>';
        html+='<div class="revealnote">💡 '+esc(note)+'</div>';
      } else {
        html+='<div class="ans"><b>Odpowiedź:</b> '+esc(a)+'</div><div class="hook">💡 '+esc(note)+'</div>';
      }
      html+='<label class="mark"><input type="checkbox" '+(done[n]?'checked':'')+'> opanowane</label>';
      card.innerHTML=html;
      const opt2=optsFor(n);
      if(opt2){
        const correct=opt2.a||[];
        const btns=card.querySelectorAll('.opt');
        btns.forEach(b=>{ b.onclick=()=>{
          if(card.dataset.answered) return; card.dataset.answered="1";
          const i=+b.dataset.i;
          btns.forEach(x=>x.classList.add('locked'));
          correct.forEach(ci=>btns[ci] && btns[ci].classList.add('correct'));
          if(!correct.includes(i)) b.classList.add('wrong');
          card.querySelector('.revealnote').classList.add('show');
        };});
      }
    } else {
      html+='<div class="ans"><b>Odpowiedź:</b> '+esc(a)+'</div>'+
        '<div class="hook">💡 '+esc(note)+'</div>'+
        '<label class="mark"><input type="checkbox" '+(done[n]?'checked':'')+'> opanowane</label>';
      card.innerHTML=html;
    }
    card.querySelector('.mark input').onchange=e=>{ done[n]=e.target.checked; if(!done[n])delete done[n]; saveDone(); if(hideDone)render(); else{card.classList.toggle('done',e.target.checked); countEl.textContent=stat();} };
    listEl.appendChild(card);
  });
  countEl.textContent=stat(shown);
  function stat(s){ const poolInfo=hideDone?' • pula: '+(rows.length-doneCount):''; return (s!==undefined?s+' / ':'')+rows.length+' pytań • opanowane: '+doneCount+poolInfo; }
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

qInput.oninput=render;
const bNauka=document.getElementById('modeNauka');
const bTest=document.getElementById('modeTest');
const bDraw=document.getElementById('drawBtn');
function setMode(m){
  mode=m; drawSet=null;
  bNauka.classList.toggle('on', m==="nauka");
  bTest.classList.toggle('on', m==="test");
  bDraw.style.display = (m==="test") ? "" : "none";
  render();
}
bNauka.onclick=()=>setMode("nauka");
bTest.onclick=()=>setMode("test");
document.getElementById('hideDone').onclick=e=>{ hideDone=!hideDone; e.target.classList.toggle('on',hideDone); drawSet=null; render(); };
bDraw.onclick=()=>{
  const pool=(DATA[activeCat]||[]).map(r=>r[0]).filter(n=>!(hideDone&&done[n]));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  drawSet=new Set(pool.slice(0,20));
  qInput.value=""; render();
  window.scrollTo({top:0,behavior:'smooth'});
};

(async function init(){
  try{ const r = await window.storage.get('done_'+activeCat); if(r&&r.value) done = JSON.parse(r.value); }catch(e){}
  render();
})();
</script>
